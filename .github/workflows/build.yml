name: Build & Release

on:
  push:
    branches: [ feature/ios-parity ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Calculate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${{ github.ref_name }}"
          else
            VERSION_NAME="1.0.8-dev.$(git rev-list --count HEAD)"
          fi
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}

      - name: Build Release APK
        if: env.KEYSTORE_BASE64 != ''
        continue-on-error: true
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > signing.properties <<EOF
          storeFile=$(pwd)/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          ./gradlew assembleRelease --no-daemon || echo "Release build failed"

      - name: Rename Debug APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/hermex-${{ steps.version.outputs.version_name }}-debug.apk

      - name: Rename Release APK
        if: always()
        run: |
          if [ -f app/build/outputs/apk/release/*.apk ]; then
            cp app/build/outputs/apk/release/*.apk artifacts/hermex-${{ steps.version.outputs.version_name }}-release.apk
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermex-debug
          path: artifacts/hermex-${{ steps.version.outputs.version_name }}-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermex-release
          path: artifacts/hermex-${{ steps.version.outputs.version_name }}-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Hermex Android ${{ github.ref_name }}"
          body: |
            ## Hermex Android ${{ github.ref_name }}

            ### Changes
            - Package: `com.peditx.hermex`
            - Version: `${{ github.ref_name }}`
            - Network security config enforced (HTTPS only)
            - Full iOS feature parity

            ### Install
            Download APK and install:
            \`\`\`bash
            adb install hermex-${{ github.ref_name }}-debug.apk
            # or for signed release:
            adb install hermex-${{ github.ref_name }}-release.apk
            \`\`\`
          files: |
            artifacts/hermex-${{ github.ref_name }}-debug.apk
            artifacts/hermex-${{ github.ref_name }}-release.apk
          draft: false
          prerelease: false