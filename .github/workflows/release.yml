name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r27c
          build-tools-version: 36.0.0
          accept-android-sdk-licenses: true

      - name: Decode Keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_OUTPUT

      - name: Create signing.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > signing.properties <<EOF
          storeFile=${{ steps.keystore.outputs.KEYSTORE_PATH }}
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Verify AAB
        run: |
          AAB_PATH=$(find . -name "*.aab" -path "*/release/*" | head -1)
          echo "AAB_PATH=$AAB_PATH" >> $GITHUB_OUTPUT
          ls -lh "$AAB_PATH"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ steps.verify.outputs.AAB_PATH }}
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: artifacts

      - name: Find AAB
        id: aab
        run: |
          AAB=$(find artifacts -name "*.aab" | head -1)
          echo "AAB_PATH=$AAB" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Hermex Android ${{ github.ref_name }}"
          body: |
            ## Hermex Android ${{ github.ref_name }}

            ### Changes
            - Package: `com.peditx.hermex`
            - Version: `${{ github.ref_name }}`
            - Network security config enforced (HTTPS only)
            - Full iOS feature parity

            ### Install
            Download `app-release.aab` and install via:
            \`\`\`bash
            adb install-multiple app-release.aab
            \`\`\`
            Or upload to Play Console Internal Testing.
          files: |
            ${{ steps.aab.outputs.AAB_PATH }}
          draft: false
          prerelease: false